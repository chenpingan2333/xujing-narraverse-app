name: Build & Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create webDir for Capacitor
        run: mkdir -p out && echo "<html><body></body></html>" > out/index.html

      - name: Create keystore
        run: |
          keytool -genkey -v \
            -keystore android/narraverse-release.keystore \
            -alias narraverse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEYSTORE_PASSWORD }} \
            -dname "CN=XuJing, OU=Dev, O=XuJing, L=Beijing, ST=Beijing, C=CN"
          echo "storeFile=narraverse-release.keystore" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=narraverse" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties

      - name: Sync Capacitor
        run: npx cap sync

      - name: Fix app name (cap sync overwrites strings.xml)
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">XuJing</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">XuJing</string>|' android/app/src/main/res/values/strings.xml

      - name: Generate app icon (after cap sync)
        run: |
          for size in 48 72 96 144 192; do
            case $size in
              48) dir="mipmap-mdpi" ;;
              72) dir="mipmap-hdpi" ;;
              96) dir="mipmap-xhdpi" ;;
              144) dir="mipmap-xxhdpi" ;;
              192) dir="mipmap-xxxhdpi" ;;
            esac
            mkdir -p "android/app/src/main/res/$dir"
            convert icon.png -resize ${size}x${size} "android/app/src/main/res/$dir/ic_launcher.png"
            cp "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
          done

      - name: Build Android Release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Get version
        id: version
        run: |
          TAG=${{ github.ref_name }}
          echo "tag=${TAG#v}" >> $GITHUB_OUTPUT
          echo "apk_name=xujing-${TAG#v}.apk" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ${{ steps.version.outputs.apk_name }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xujing-apk
          path: ${{ steps.version.outputs.apk_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "XuJing v${{ steps.version.outputs.tag }}"
          body: |
            ## XuJing v${{ steps.version.outputs.tag }}

            ### Android APK

            下载 `${{ steps.version.outputs.apk_name }}` 安装到 Android 手机。

            ### 安装说明

            1. 下载 APK
            2. 允许「安装未知来源应用」
            3. 打开应用，登录即用
          files: ${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

