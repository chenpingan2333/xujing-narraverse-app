version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: narraverse
      POSTGRES_USER: narraverse
      POSTGRES_PASSWORD: narraverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narraverse"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: narraverse
      DB_USER: narraverse
      DB_PASSWORD: narraverse
      API_KEY_ENCRYPTION_KEY: "${API_KEY_ENCRYPTION_KEY:-dev-encryption-key-change-in-prod}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      GROK_API_KEY: "${GROK_API_KEY:-}"
      GROK_BASE_URL: "${GROK_BASE_URL:-https://api.x.ai}"
      GROK_MODEL: "${GROK_MODEL:-grok-4-fast}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
